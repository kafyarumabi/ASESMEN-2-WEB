<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="header">
    <h1>To-Do List & Task Manager</h1>
    <p>Tambah, tandai selesai, hapus, filter, Local Storage</p>
  </header>

  <nav class="navbar">
    <a href="index.html">Home</a>
    <a href="profile.html">Profile</a>
    <a href="projects.html">Projects</a>
    <a href="expense.html">Expense Tracker</a>
    <a class="active" href="todo.html">To-Do</a>
  </nav>

  <main class="container">
    <section class="card">
      <h2>Tambah Tugas</h2>

      <form id="todoForm" class="form">
        <input type="text" id="taskInput" placeholder="Masukkan tugas..." required />
        <button class="btn" type="submit">Tambah</button>
      </form>

      <div class="filter-area">
        <select id="filterStatus">
          <option value="all">Semua</option>
          <option value="done">Selesai</option>
          <option value="pending">Belum Selesai</option>
        </select>
      </div>
    </section>

    <section class="card">
      <h2>Daftar Tugas</h2>
      <ul id="taskList" class="list"></ul>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; 2026 - To-Do List</p>
  </footer>

  <script src="js/todo.js"></script>
</body>
</html>
